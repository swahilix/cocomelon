name: Build fresh Prinx Laravel project

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged Prinx source
        uses: actions/checkout@v4
        with:
          ref: prinx-import
          fetch-depth: 0

      - name: Repair the two damaged staged chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              '.import/chunk-00': '96b77846364a28d1e8d0282b63644f635ded7935c9c83818fe5fd5d1b41fa2a3',
              '.import/chunk-08': '5936a2503c0a7f5f55f3cebb58a2952926fcb022712b13d22a750e0c3923704d',
          }
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          for filename, wanted in expected.items():
              path = Path(filename)
              data = path.read_text()
              current = hashlib.sha256(data.encode()).hexdigest()
              if current == wanted:
                  print(f'{filename}: already correct')
                  continue
              if len(data) != 11999:
                  raise SystemExit(f'{filename}: expected one-character deletion, got {len(data)} bytes')
              repaired = None
              for pos in range(len(data) + 1):
                  prefix, suffix = data[:pos], data[pos:]
                  for ch in alphabet:
                      candidate = prefix + ch + suffix
                      if hashlib.sha256(candidate.encode()).hexdigest() == wanted:
                          repaired = candidate
                          print(f'{filename}: repaired missing character at offset {pos}')
                          break
                  if repaired is not None:
                      break
              if repaired is None:
                  raise SystemExit(f'{filename}: deterministic repair failed')
              path.write_text(repaired)
          PY

      - name: Verify every staged chunk
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-chunks.sha256 <<'EOF'
          96b77846364a28d1e8d0282b63644f635ded7935c9c83818fe5fd5d1b41fa2a3  .import/chunk-00
          1e035c263134dcf740d8f63f1f0a5a45b47049b441eff76c09f9d01b673ae4fe  .import/chunk-01
          40b2cfcf60037c8b2a613562a6ec5e18aa6a4b236b264da2ca0b0638f7405da8  .import/chunk-02
          b45a338c43246b560f999bd813b44e59a62f8891a2b4fbd0f0bf0df76620c7e1  .import/chunk-03
          57ff2f1eca67e3d3beb3b983d46716438afcef075536ab1fc7a7b0fb5a7537b6  .import/chunk-04
          f6e42ec10c28d95e2951f69523a52d4c07873c77ba21969a134721eb8714e969  .import/chunk-05
          1138819b2bf64db3fa5b32ae0a45aa4b63c96e52d9f789b5973c23e76490910a  .import/chunk-06
          1af264dded09395fe42c7d44e7bb601797a3b0c6951249d3efca0a329b2c0c33  .import/chunk-07
          5936a2503c0a7f5f55f3cebb58a2952926fcb022712b13d22a750e0c3923704d  .import/chunk-08
          16599bc13947de82c17bff6710f9f7329c2fff3463c8ea249a0d9b75d707a9b1  .import/chunk-09
          cbd5ce02e855d555dda5a64e5249178bf474f4d0355254a756e184ba98228040  .import/chunk-10
          60f83bba10bd45f70ce15da53217a54621467bf1b8b40dead942f3aba42a20f2  .import/chunk-11
          be560335c3c185d5b135a4aa973ef5caebaf33f5684aa6a9b7fcb99f070e3906  .import/chunk-12
          f1fd2db41437a1b44a5111a04126d902e478fae8cb1e336052e49c824a82c1d0  .import/chunk-13
          EOF
          sha256sum -c /tmp/expected-chunks.sha256
          for f in .import/chunk-{00..13}; do base64 --decode "$f" >/dev/null; done

      - name: Reconstruct developed source
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-{00..13} > /tmp/prinx.b64
          base64 --decode /tmp/prinx.b64 > /tmp/prinx.tar.xz
          echo 'bf5d922a34c75d7988e175eceb5b84a83ea2ebe3b087d1466d37d32bce5720d9  /tmp/prinx.tar.xz' | sha256sum -c -
          mkdir -p /tmp/prinx-developed
          tar -xJf /tmp/prinx.tar.xz -C /tmp/prinx-developed
          test -f /tmp/prinx-developed/artisan
          test -f /tmp/prinx-developed/composer.json

      - name: Replace staged branch with normal source files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.import' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='public/build' \
            --exclude='bootstrap/ssr' \
            /tmp/prinx-developed/ ./

          rm -rf .import
          rm -f .github/workflows/import-prinx.yml
          test -f artisan
          test -f composer.json
          test -f routes/web.php
          test -f PRINX-IMPLEMENTATION-PLAN.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Prinx Laravel ecommerce project'
          git push origin HEAD:prinx-import
