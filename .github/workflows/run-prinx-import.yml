name: Run Prinx import

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-prinx-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged Prinx branch
        uses: actions/checkout@v4
        with:
          ref: prinx-import
          fetch-depth: 0

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-* > /tmp/prinx.b64
          base64 -d /tmp/prinx.b64 > /tmp/prinx.tar.xz
          tar -xJf /tmp/prinx.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-prinx.yml

      - name: Commit clean project to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Prinx Laravel ecommerce project"
          git push origin HEAD:prinx-import
