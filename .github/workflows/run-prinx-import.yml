name: Build fresh Prinx Laravel project

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged Prinx source
        uses: actions/checkout@v4
        with:
          ref: prinx-import
          fetch-depth: 0

      - name: Validate staged chunks
        shell: bash
        run: |
          set -euo pipefail
          echo 'Remote chunk checksums:'
          sha256sum .import/chunk-*
          echo 'Validating Base64:'
          for f in .import/chunk-*; do
            printf '%s bytes=%s ' "$f" "$(wc -c < "$f")"
            if base64 --decode "$f" >/dev/null 2>&1; then
              echo OK
            else
              echo INVALID
            fi
          done

      - name: Reconstruct developed source
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-* > /tmp/prinx.b64
          base64 --decode /tmp/prinx.b64 > /tmp/prinx.tar.xz
          echo 'bf5d922a34c75d7988e175eceb5b84a83ea2ebe3b087d1466d37d32bce5720d9  /tmp/prinx.tar.xz' | sha256sum -c -
          mkdir -p /tmp/prinx-developed
          tar -xJf /tmp/prinx.tar.xz -C /tmp/prinx-developed
          test -f /tmp/prinx-developed/artisan
          test -f /tmp/prinx-developed/composer.json

      - name: Replace staged branch with normal source files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.import' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='public/build' \
            --exclude='bootstrap/ssr' \
            /tmp/prinx-developed/ ./

          rm -rf .import
          rm -f .github/workflows/import-prinx.yml
          test -f artisan
          test -f composer.json
          test -f routes/web.php
          test -f PRINX-IMPLEMENTATION-PLAN.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Prinx Laravel ecommerce project'
          git push origin HEAD:prinx-import
