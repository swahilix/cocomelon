name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm install
      - run: npm run build
      - run: php artisan test

      - name: Smoke test Inertia SSR server
        shell: bash
        run: |
          node bootstrap/ssr/ssr.js > /tmp/prinx-ssr.log 2>&1 &
          SSR_PID=$!
          trap 'kill $SSR_PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:13714/health

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production assets
        run: |
          npm install
          npm run build
          test -f public/build/manifest.json

      - name: Create deployment archive
        shell: bash
        run: |
          rm -f /tmp/prinx-release.tar.gz prinx-release.tar.gz
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            -czf /tmp/prinx-release.tar.gz .
          mv /tmp/prinx-release.tar.gz prinx-release.tar.gz
          ls -lh prinx-release.tar.gz

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
              echo "DEPLOY_PATH secret is missing"
              exit 1
            fi
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            rm -f "$HOME/prinx-release.tar.gz"
            echo "Home directory: $HOME"
            echo "Configured deploy folder: $(basename "${{ secrets.DEPLOY_PATH }}")"

      - name: Upload release to cPanel home
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "prinx-release.tar.gz"
          target: "./"
          overwrite: true
          debug: true

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            RELEASE="$HOME/prinx-release.tar.gz"

            echo "Checking staged release: $RELEASE"
            test -f "$RELEASE" || { echo "ERROR: release archive was not uploaded to $HOME"; exit 1; }

            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              echo "ERROR: configured DEPLOY_PATH is not the existing Laravel app root."
              echo "Configured folder: $(basename "$DEPLOY_DIR")"
              echo ""
              echo "Laravel app roots found under this cPanel account:"
              found=0
              while IFS= read -r env_file; do
                candidate="$(dirname "$env_file")"
                if [ -f "$candidate/artisan" ] && [ -f "$candidate/composer.json" ]; then
                  folder="$(basename "$candidate")"
                  printf '  folder=%s | env=yes | artisan=yes | composer=yes\n' "$folder"
                  found=1
                fi
              done < <(find "$HOME" -maxdepth 5 -type f -name '.env' 2>/dev/null)
              if [ "$found" -eq 0 ]; then
                echo "  No directory containing .env + artisan + composer.json was found."
              fi
              echo ""
              echo "Set DEPLOY_PATH to the full path of the Prinx Laravel app root shown above, then run again."
              rm -f "$RELEASE"
              exit 1
            fi

            echo "Production environment found in folder: $(basename "$DEPLOY_DIR")"
            tar -xzf "$RELEASE" -C "$DEPLOY_DIR"
            rm -f "$RELEASE"

            cd "$DEPLOY_DIR"
            test -f artisan || { echo "ERROR: artisan missing after extraction"; exit 1; }
            test -f composer.json || { echo "ERROR: composer.json missing after extraction"; exit 1; }
            test -f public/build/manifest.json || { echo "ERROR: Vite manifest missing after extraction"; exit 1; }

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Deployment complete: ${{ github.sha }}"
