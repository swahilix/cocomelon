name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm install
      - run: npm run build
      - run: php artisan test

      - name: Smoke test Inertia SSR server
        shell: bash
        run: |
          node bootstrap/ssr/ssr.js > /tmp/prinx-ssr.log 2>&1 &
          SSR_PID=$!
          trap 'kill $SSR_PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:13714/health

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production PHP dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          test -f vendor/autoload.php

      - name: Build production assets
        run: |
          npm install
          npm run build
          test -f public/build/manifest.json

      - name: Create deployment archive
        shell: bash
        run: |
          rm -f /tmp/prinx-release.tar.gz prinx-release.tar.gz
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            -czf /tmp/prinx-release.tar.gz .
          mv /tmp/prinx-release.tar.gz prinx-release.tar.gz
          ls -lh prinx-release.tar.gz

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
              echo "DEPLOY_PATH secret is missing"
              exit 1
            fi
            rm -f "$HOME/prinx-release.tar.gz"
            echo "Configured deploy folder: $(basename "${{ secrets.DEPLOY_PATH }}")"

      - name: Upload release to cPanel home
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "prinx-release.tar.gz"
          target: "./"
          overwrite: true
          debug: true

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            RELEASE="$HOME/prinx-release.tar.gz"

            echo "Checking staged release: $RELEASE"
            test -f "$RELEASE" || { echo "ERROR: release archive was not uploaded to $HOME"; exit 1; }

            if [ ! -f "$DEPLOY_DIR/.env" ] || [ ! -f "$DEPLOY_DIR/artisan" ] || [ ! -f "$DEPLOY_DIR/composer.json" ]; then
              target_name="$(basename "$DEPLOY_DIR")"
              echo "Configured full path is not a Laravel root; resolving folder: $target_name"

              matches=""
              count=0
              while IFS= read -r env_file; do
                candidate="$(dirname "$env_file")"
                if [ "$(basename "$candidate")" = "$target_name" ] && [ -f "$candidate/artisan" ] && [ -f "$candidate/composer.json" ]; then
                  matches="$candidate"
                  count=$((count + 1))
                fi
              done < <(find "$HOME" -maxdepth 5 -type f -name '.env' 2>/dev/null)

              if [ "$count" -eq 1 ]; then
                DEPLOY_DIR="$matches"
                echo "Resolved unique Laravel app folder: $(basename "$DEPLOY_DIR")"
              else
                echo "ERROR: could not uniquely resolve Laravel app folder '$target_name' (matches=$count)."
                echo "Laravel roots discovered:"
                while IFS= read -r env_file; do
                  candidate="$(dirname "$env_file")"
                  if [ -f "$candidate/artisan" ] && [ -f "$candidate/composer.json" ]; then
                    rel="${candidate#$HOME/}"
                    printf '  relative=%s\n' "$rel"
                  fi
                done < <(find "$HOME" -maxdepth 5 -type f -name '.env' 2>/dev/null)
                rm -f "$RELEASE"
                exit 1
              fi
            fi

            echo "Deploying into resolved folder: $(basename "$DEPLOY_DIR")"

            # Releases are extracted over the existing cPanel app directory.
            # Remove files that existed in the reconstructed branch but were
            # removed from the canonical uploaded Prinx source, otherwise old
            # migrations continue to be discovered by Laravel.
            rm -f "$DEPLOY_DIR/database/migrations/2026_08_21_000800_add_commerce_operations.php"

            tar -xzf "$RELEASE" -C "$DEPLOY_DIR"
            rm -f "$RELEASE"

            cd "$DEPLOY_DIR"
            test -f artisan || { echo "ERROR: artisan missing after extraction"; exit 1; }
            test -f composer.json || { echo "ERROR: composer.json missing after extraction"; exit 1; }
            test -f vendor/autoload.php || { echo "ERROR: production vendor dependencies missing after extraction"; exit 1; }
            test -f public/build/manifest.json || { echo "ERROR: Vite manifest missing after extraction"; exit 1; }
            test -f .env || { echo "ERROR: production .env missing"; exit 1; }

            PHP_BIN=""
            for candidate in \
              /opt/cpanel/ea-php83/root/usr/bin/php \
              /opt/alt/php83/usr/bin/php \
              /usr/local/bin/ea-php83 \
              /usr/local/bin/php83 \
              /usr/bin/php83 \
              "$(command -v ea-php83 2>/dev/null || true)" \
              "$(command -v alt-php83 2>/dev/null || true)" \
              "$(command -v php83 2>/dev/null || true)" \
              "$(command -v php 2>/dev/null || true)"; do
              [ -n "$candidate" ] || continue
              [ -x "$candidate" ] || continue
              if "$candidate" -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);' >/dev/null 2>&1; then
                PHP_BIN="$candidate"
                break
              fi
            done

            if [ -z "$PHP_BIN" ]; then
              echo "ERROR: no PHP 8.3+ CLI binary was found on this cPanel account."
              echo "Default CLI PHP is:"
              php -v | head -1 || true
              echo "Configure PHP 8.3 for the domain in cPanel and ensure its CLI binary is available."
              exit 1
            fi

            echo "Deployment PHP runtime:"
            "$PHP_BIN" -v | head -1

            "$PHP_BIN" artisan optimize:clear

            # Production previously received the stock foundation from an older
            # commerce migration that was removed from the canonical repository.
            # If the replacement migration is absent from Laravel's history but
            # its complete compatible schema is already present, baseline it once
            # so migrate --force can continue with the follow-up migrations.
            "$PHP_BIN" -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

              $migration = "2026_08_22_120000_create_stock_management_tables";
              $schema = Illuminate\Support\Facades\Schema::getFacadeRoot();
              $db = Illuminate\Support\Facades\DB::getFacadeRoot();

              if (! $schema->hasTable("migrations")) {
                  echo "Migration table does not exist yet; normal migration bootstrap will run.\n";
                  exit(0);
              }

              if ($db->table("migrations")->where("migration", $migration)->exists()) {
                  echo "Stock foundation migration already recorded.\n";
                  exit(0);
              }

              $expected = [
                  "stock_purchases" => ["id", "reference", "supplier_name", "invoice_number", "purchase_date", "subtotal", "additional_cost", "total", "payment_method", "notes", "created_by", "created_at", "updated_at"],
                  "stock_purchase_items" => ["id", "stock_purchase_id", "product_id", "quantity", "unit_cost", "line_total", "created_at", "updated_at"],
                  "pos_sales" => ["id", "reference", "customer_name", "customer_phone", "subtotal", "discount", "total", "amount_paid", "change_due", "payment_method", "notes", "created_by", "created_at", "updated_at"],
                  "pos_sale_items" => ["id", "pos_sale_id", "product_id", "product_name", "sku", "quantity", "unit_price", "unit_cost", "line_total", "created_at", "updated_at"],
                  "expenses" => ["id", "reference", "expense_date", "category", "description", "amount", "payment_method", "payee", "notes", "created_by", "created_at", "updated_at"],
                  "stock_movements" => ["id", "product_id", "direction", "type", "quantity", "balance_after", "unit_cost", "reference", "notes", "created_by", "created_at", "updated_at"],
              ];

              $presentTables = [];
              $problems = [];
              foreach ($expected as $table => $columns) {
                  if (! $schema->hasTable($table)) {
                      continue;
                  }
                  $presentTables[] = $table;
                  foreach ($columns as $column) {
                      if (! $schema->hasColumn($table, $column)) {
                          $problems[] = $table.".".$column;
                      }
                  }
              }

              if (count($presentTables) === 0) {
                  echo "No legacy stock foundation tables detected; migration will run normally.\n";
                  exit(0);
              }

              if (count($presentTables) !== count($expected) || count($problems) > 0) {
                  fwrite(STDERR, "ERROR: partial or incompatible legacy stock schema detected.\n");
                  fwrite(STDERR, "Existing foundation tables: ".implode(", ", $presentTables)."\n");
                  if ($problems) fwrite(STDERR, "Missing required columns: ".implode(", ", $problems)."\n");
                  exit(2);
              }

              $batch = max(1, (int) $db->table("migrations")->max("batch"));
              $db->table("migrations")->insert(["migration" => $migration, "batch" => $batch]);
              echo "Baselined legacy stock foundation as {$migration}.\n";
            '

            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan storage:link || true
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache

            echo "Deployment complete: ${{ github.sha }}"
