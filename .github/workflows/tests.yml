name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm install
      - run: npm run build
      - run: php artisan test

      - name: Smoke test Inertia SSR server
        shell: bash
        run: |
          node bootstrap/ssr/ssr.js > /tmp/prinx-ssr.log 2>&1 &
          SSR_PID=$!
          trap 'kill $SSR_PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:13714/health

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production assets
        run: |
          npm install
          npm run build

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
              echo "DEPLOY_PATH secret is missing"
              exit 1
            fi
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            echo "Deploying commit ${{ github.sha }} to ${{ secrets.DEPLOY_PATH }}"

      - name: Upload application files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "app,bootstrap,config,database,public,resources,routes,storage,artisan,composer.json,package.json,phpunit.xml,postcss.config.js,tailwind.config.js,vite.config.js"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "Verifying uploaded release"
            test -f artisan
            test -f composer.json
            test -f public/build/manifest.json

            if [ ! -f .env ]; then
              echo "Production .env is missing at ${{ secrets.DEPLOY_PATH }}/.env"
              exit 1
            fi

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Deployment complete: ${{ github.sha }}"
