name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm install
      - run: npm run build
      - run: php artisan test
      - name: Smoke test Inertia SSR server
        shell: bash
        run: |
          node bootstrap/ssr/ssr.js > /tmp/prinx-ssr.log 2>&1 &
          SSR_PID=$!
          trap 'kill $SSR_PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:13714/health

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            echo "SSH connection successful"
            echo "Workflow trigger test: 2026-08-21 12:29 EAT"
